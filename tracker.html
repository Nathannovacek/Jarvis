<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #e31937;
    --accent2: #ff6b35;
    --text: #f0f0f8;
    --muted: #6b6b88;
    --success: #22d3a0;
    --warning: #f5c842;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
    --s-identified: #6b6b88;
    --s-contacted: #4a90d9;
    --s-meeting: #f5c842;
    --s-proposal: #ff6b35;
    --s-won: #22d3a0;
    --s-lost: #e31937;
  }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    min-height: 100vh; padding: 24px;
    background-image:
      radial-gradient(ellipse 80% 40% at 50% -10%, rgba(227,25,55,0.10) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
  }

  /* HEADER */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo { width: 36px; height: 36px; background: var(--accent); clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: white; flex-shrink: 0; }
  .header-text h1 { font-size: 13px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); }
  .header-text p { font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: 0.05em; }
  .btn { border: none; border-radius: 7px; padding: 9px 18px; font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #c8152f; transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

  /* STATS ROW */
  .stats-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; flex: 1; min-width: 100px; }
  .stat-label { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
  .stat-value { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }

  /* KANBAN */
  .kanban { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; align-items: start; }
  .column { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .col-header { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .col-title { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
  .col-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .col-count { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .col-body { padding: 10px; min-height: 120px; display: flex; flex-direction: column; gap: 8px; }

  /* CARDS */
  .card {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; cursor: pointer; transition: all 0.15s; position: relative;
    animation: cardIn 0.25s ease;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card-company { font-size: 13px; font-weight: 700; margin-bottom: 5px; }
  .card-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .card-tag { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px; font-family: var(--mono); font-size: 9px; color: #8080a0; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; }
  .card-tier { font-family: var(--mono); font-size: 9px; font-weight: 500; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 3px; text-transform: uppercase; }
  .tier-1 { background: rgba(227,25,55,0.15); color: var(--accent); }
  .tier-2 { background: rgba(255,107,53,0.15); color: var(--accent2); }
  .tier-3 { background: rgba(34,211,160,0.1); color: var(--success); }
  .card-date { font-family: var(--mono); font-size: 9px; color: var(--muted); }
  .card-due { font-family: var(--mono); font-size: 9px; }
  .due-soon { color: var(--warning); }
  .due-overdue { color: var(--accent); }
  .due-ok { color: var(--muted); }

  /* MOVE BUTTONS */
  .card-actions { display: flex; gap: 4px; margin-top: 8px; }
  .move-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 7px; font-family: var(--mono); font-size: 9px; color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .move-btn:hover { border-color: var(--accent); color: var(--text); }
  .del-btn { background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 3px 7px; font-family: var(--mono); font-size: 9px; color: var(--muted); cursor: pointer; transition: all 0.15s; margin-left: auto; }
  .del-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* MODAL */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 16px; font-weight: 800; margin-bottom: 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 7px; padding: 10px 14px; color: var(--text);
    font-family: var(--mono); font-size: 12px; outline: none; transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 70px; }
  .field select option { background: var(--surface2); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

  /* EMPTY STATE */
  .empty-state { padding: 20px 10px; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--muted); line-height: 1.8; }

  /* FILTER BAR */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .filter-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-family: var(--mono); font-size: 11px; color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .filter-chip.active { border-color: var(--accent); color: var(--text); background: rgba(227,25,55,0.1); }
  .search-input { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-family: var(--mono); font-size: 11px; color: var(--text); outline: none; transition: border-color 0.2s; }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  @media (max-width: 900px) {
    .kanban { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    .kanban { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body><nav style="display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap"><a href="index.html" style="background:#1a1a24;border:1px solid #2a2a3a;border-radius:6px;padding:6px 14px;font-family:'DM Mono',monospace;font-size:11px;color:#6b6b88;text-decoration:none">⌂ Home</a><a href="writer.html" style="background:#1a1a24;border:1px solid #2a2a3a;border-radius:6px;padding:6px 14px;font-family:'DM Mono',monospace;font-size:11px;color:#6b6b88;text-decoration:none">Writer</a><a href="researcher.html" style="background:#1a1a24;border:1px solid #2a2a3a;border-radius:6px;padding:6px 14px;font-family:'DM Mono',monospace;font-size:11px;color:#6b6b88;text-decoration:none">Researcher</a><a href="tracker.html" style="background:rgba(227,25,55,0.15);border:1px solid rgba(227,25,55,0.4);border-radius:6px;padding:6px 14px;font-family:'DM Mono',monospace;font-size:11px;color:#e31937;text-decoration:none">Tracker</a><a href="analyst.html" style="background:#1a1a24;border:1px solid #2a2a3a;border-radius:6px;padding:6px 14px;font-family:'DM Mono',monospace;font-size:11px;color:#6b6b88;text-decoration:none">Analyst</a><a href="briefer.html" style="background:#1a1a24;border:1px solid #2a2a3a;border-radius:6px;padding:6px 14px;font-family:'DM Mono',monospace;font-size:11px;color:#6b6b88;text-decoration:none">Briefer</a></nav>

<div class="header">
  <div class="header-left">
    <div class="logo">J</div>
    <div class="header-text">
      <h1>Project Jarvis — Tracker</h1>
      <p>agent_03 · enterprise/fleet pipeline</p>
    </div>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-ghost" onclick="exportCSV()">Export CSV</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ Add Account</button>
  </div>
</div>

<div class="stats-row" id="statsRow"></div>

<div class="filter-bar">
  <input class="search-input" id="searchInput" placeholder="Search accounts..." oninput="render()" />
  <span class="filter-chip active" data-tier="all" onclick="setTierFilter(this,'all')">All Tiers</span>
  <span class="filter-chip" data-tier="Tier 1" onclick="setTierFilter(this,'Tier 1')">Tier 1</span>
  <span class="filter-chip" data-tier="Tier 2" onclick="setTierFilter(this,'Tier 2')">Tier 2</span>
  <span class="filter-chip" data-tier="Tier 3" onclick="setTierFilter(this,'Tier 3')">Tier 3</span>
</div>

<div class="kanban" id="kanban"></div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" style="display:none">
  <div class="modal">
    <h2 id="modalTitle">Add Account</h2>
    <div class="field"><label>Company Name</label><input type="text" id="fCompany" placeholder="e.g. Linfox" /></div>
    <div class="field"><label>Industry / Notes</label><input type="text" id="fIndustry" placeholder="e.g. Logistics · Large national fleet" /></div>
    <div class="field"><label>Tier</label>
      <select id="fTier">
        <option value="Tier 1">Tier 1 — Large national fleet, high EV readiness</option>
        <option value="Tier 2">Tier 2 — Significant fleet, moderate readiness</option>
        <option value="Tier 3">Tier 3 — Smaller/local fleet, emerging opportunity</option>
      </select>
    </div>
    <div class="field"><label>Stage</label>
      <select id="fStage">
        <option value="Identified">Identified</option>
        <option value="Contacted">Contacted</option>
        <option value="Meeting">Meeting</option>
        <option value="Proposal">Proposal</option>
        <option value="Won">Won</option>
        <option value="Lost">Lost</option>
      </select>
    </div>
    <div class="field"><label>Follow-up Date</label><input type="date" id="fFollowup" /></div>
    <div class="field"><label>Tags (comma separated)</label><input type="text" id="fTags" placeholder="e.g. QLD-based, Mining, ESG-committed" /></div>
    <div class="field"><label>Notes</label><textarea id="fNotes" placeholder="Key contacts, last conversation, next steps..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAccount()">Save Account</button>
    </div>
  </div>
</div>

<script>
const STAGES = ['Identified','Contacted','Meeting','Proposal','Won','Lost'];
const STAGE_COLORS = { Identified:'var(--s-identified)', Contacted:'var(--s-contacted)', Meeting:'var(--s-meeting)', Proposal:'var(--s-proposal)', Won:'var(--s-won)', Lost:'var(--s-lost)' };

let accounts = [];
let editingId = null;
let tierFilter = 'all';

function load() {
  try { accounts = JSON.parse(localStorage.getItem('jarvis_tracker') || '[]'); } catch(e) { accounts = []; }
  // Seed demo data if empty
  if (accounts.length === 0) {
    accounts = [
      { id: uid(), company: 'Linfox', industry: 'Logistics · Large national fleet', tier: 'Tier 1', stage: 'Identified', tags: ['Logistics','QLD-based','Large Fleet'], notes: 'Strong fleet modernisation signals. Target: Fleet Manager + Head of Procurement.', followup: '', added: today() },
      { id: uid(), company: 'Fortescue', industry: 'Mining · ESG-committed', tier: 'Tier 1', stage: 'Identified', tags: ['Mining','ESG-committed','National'], notes: "Andrew Forrest EV push. Twiggy's green energy agenda aligns well.", followup: '', added: today() },
      { id: uid(), company: 'Gold Coast City Council', industry: 'Government · Council fleet', tier: 'Tier 2', stage: 'Identified', tags: ['Government','QLD-based','Council'], notes: 'Sustainability mandate. Fleet of light vehicles ripe for EV transition.', followup: '', added: today() },
    ];
    save();
  }
}

function save() { localStorage.setItem('jarvis_tracker', JSON.stringify(accounts)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function today() { return new Date().toISOString().split('T')[0]; }

function dueSeverity(dateStr) {
  if (!dateStr) return null;
  const diff = (new Date(dateStr) - new Date()) / 86400000;
  if (diff < 0) return 'due-overdue';
  if (diff <= 3) return 'due-soon';
  return 'due-ok';
}

function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-AU', { day:'numeric', month:'short' });
}

function setTierFilter(el, tier) {
  document.querySelectorAll('.filter-chip[data-tier]').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  tierFilter = tier;
  render();
}

function filteredAccounts() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  return accounts.filter(a => {
    const matchTier = tierFilter === 'all' || a.tier === tierFilter;
    const matchQ = !q || a.company.toLowerCase().includes(q) || (a.industry||'').toLowerCase().includes(q) || (a.tags||[]).join(' ').toLowerCase().includes(q);
    return matchTier && matchQ;
  });
}

function renderStats() {
  const total = accounts.length;
  const active = accounts.filter(a => !['Won','Lost'].includes(a.stage)).length;
  const won = accounts.filter(a => a.stage === 'Won').length;
  const overdue = accounts.filter(a => a.followup && dueSeverity(a.followup) === 'due-overdue').length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total Accounts</div><div class="stat-value" style="color:var(--text)">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Active</div><div class="stat-value" style="color:var(--accent2)">${active}</div></div>
    <div class="stat-card"><div class="stat-label">Won</div><div class="stat-value" style="color:var(--success)">${won}</div></div>
    <div class="stat-card"><div class="stat-label">Follow-ups Due</div><div class="stat-value" style="color:${overdue>0?'var(--accent)':'var(--muted)'}">${overdue}</div></div>
  `;
}

function render() {
  renderStats();
  const fa = filteredAccounts();
  const kanban = document.getElementById('kanban');
  kanban.innerHTML = '';
  STAGES.forEach(stage => {
    const cards = fa.filter(a => a.stage === stage);
    const stageIdx = STAGES.indexOf(stage);
    kanban.innerHTML += `
      <div class="column">
        <div class="col-header">
          <div class="col-title">
            <div class="col-dot" style="background:${STAGE_COLORS[stage]}"></div>
            ${stage}
          </div>
          <div class="col-count">${cards.length}</div>
        </div>
        <div class="col-body" id="col-${stage}">
          ${cards.length === 0 ? '<div class="empty-state">No accounts</div>' : ''}
          ${cards.map(a => cardHTML(a, stageIdx)).join('')}
        </div>
      </div>`;
  });
}

function cardHTML(a, stageIdx) {
  const tags = (a.tags||[]).slice(0,3).map(t => `<span class="card-tag">${t}</span>`).join('');
  const prevStage = stageIdx > 0 ? STAGES[stageIdx-1] : null;
  const nextStage = stageIdx < STAGES.length-1 ? STAGES[stageIdx+1] : null;
  const ds = dueSeverity(a.followup);
  const dueHTML = a.followup ? `<span class="card-due ${ds}">↻ ${fmtDate(a.followup)}</span>` : '';
  return `
    <div class="card" onclick="openEditModal('${a.id}')">
      <div class="card-company">${a.company}</div>
      <div class="card-meta">${a.industry||''}</div>
      ${tags ? `<div class="card-tags">${tags}</div>` : ''}
      <div class="card-footer">
        <span class="card-tier ${a.tier.toLowerCase().replace(' ','-')}">${a.tier}</span>
        ${dueHTML}
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        ${prevStage ? `<button class="move-btn" onclick="moveCard('${a.id}','${prevStage}')">← ${prevStage}</button>` : ''}
        ${nextStage ? `<button class="move-btn" onclick="moveCard('${a.id}','${nextStage}')">${nextStage} →</button>` : ''}
        <button class="del-btn" onclick="deleteCard('${a.id}')">✕</button>
      </div>
    </div>`;
}

function moveCard(id, stage) {
  const a = accounts.find(x => x.id === id);
  if (a) { a.stage = stage; save(); render(); }
}

function deleteCard(id) {
  if (!confirm('Remove this account from the pipeline?')) return;
  accounts = accounts.filter(x => x.id !== id);
  save(); render();
}

function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Add Account';
  document.getElementById('fCompany').value = '';
  document.getElementById('fIndustry').value = '';
  document.getElementById('fTier').value = 'Tier 1';
  document.getElementById('fStage').value = 'Identified';
  document.getElementById('fFollowup').value = '';
  document.getElementById('fTags').value = '';
  document.getElementById('fNotes').value = '';
  document.getElementById('modalBg').style.display = 'flex';
}

function openEditModal(id) {
  const a = accounts.find(x => x.id === id);
  if (!a) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit Account';
  document.getElementById('fCompany').value = a.company;
  document.getElementById('fIndustry').value = a.industry||'';
  document.getElementById('fTier').value = a.tier;
  document.getElementById('fStage').value = a.stage;
  document.getElementById('fFollowup').value = a.followup||'';
  document.getElementById('fTags').value = (a.tags||[]).join(', ');
  document.getElementById('fNotes').value = a.notes||'';
  document.getElementById('modalBg').style.display = 'flex';
}

function closeModal() { document.getElementById('modalBg').style.display = 'none'; }

function saveAccount() {
  const company = document.getElementById('fCompany').value.trim();
  if (!company) { alert('Company name is required.'); return; }
  const data = {
    company,
    industry: document.getElementById('fIndustry').value.trim(),
    tier: document.getElementById('fTier').value,
    stage: document.getElementById('fStage').value,
    followup: document.getElementById('fFollowup').value,
    tags: document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean),
    notes: document.getElementById('fNotes').value.trim(),
  };
  if (editingId) {
    const idx = accounts.findIndex(x => x.id === editingId);
    if (idx !== -1) accounts[idx] = { ...accounts[idx], ...data };
  } else {
    accounts.push({ id: uid(), added: today(), ...data });
  }
  save(); closeModal(); render();
}

function exportCSV() {
  const headers = ['Company','Industry','Tier','Stage','Follow-up','Tags','Notes','Added'];
  const rows = accounts.map(a => [
    a.company, a.industry||'', a.tier, a.stage, a.followup||'',
    (a.tags||[]).join('; '), (a.notes||'').replace(/\n/g,' '), a.added||''
  ].map(v => `"${v}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'jarvis_pipeline.csv'; a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('modalBg').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

load(); render();
</script>
</body>
