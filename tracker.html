<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
--bg: #0a0a0f; --surface: #111118; --surface2: #1a1a24; --border: #2a2a3a;
--accent: #e31937; --accent2: #ff6b35; --text: #f0f0f8; --muted: #6b6b88;
--success: #22d3a0; --warning: #f5c842;
--mono: 'DM Mono', monospace; --sans: 'Syne', sans-serif;
--s-identified: #6b6b88; --s-contacted: #4a90d9; --s-meeting: #f5c842;
--s-proposal: #ff6b35; --s-won: #22d3a0; --s-lost: #e31937;
}
body {
background: var(--bg); color: var(--text); font-family: var(--sans);
min-height: 100vh; padding: 24px;
background-image:
  radial-gradient(ellipse 80% 40% at 50% -10%, rgba(227,25,55,0.10) 0%, transparent 60%),
  repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
  repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
}
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
.header-left { display: flex; align-items: center; gap: 12px; }
.logo { width: 36px; height: 36px; background: var(--accent); clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: white; flex-shrink: 0; }
.header-text h1 { font-size: 13px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); }
.header-text p { font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: 0.05em; }
.btn { border: none; border-radius: 7px; padding: 9px 18px; font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: #c8152f; transform: translateY(-1px); }
.btn-primary:disabled { background: #3a1a20; color: #6b2a35; cursor: not-allowed; transform: none; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); color: var(--text); }
.stats-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; flex: 1; min-width: 100px; }
.stat-label { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
.stat-value { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.kanban { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; align-items: start; }
.column { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.col-header { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.col-title { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
.col-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.col-count { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.col-body { padding: 10px; min-height: 120px; display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; transition: all 0.15s; position: relative; animation: cardIn 0.25s ease; }
@keyframes cardIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.card-company { font-family: var(--mono); font-size: 11px; color: var(--accent2); margin-bottom: 2px; }
.card-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.card-tag { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px; font-family: var(--mono); font-size: 9px; color: #8080a0; }
.card-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px; }
.card-tier { font-family: var(--mono); font-size: 9px; font-weight: 500; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 3px; text-transform: uppercase; }
.tier-1 { background: rgba(227,25,55,0.15); color: var(--accent); }
.tier-2 { background: rgba(255,107,53,0.15); color: var(--accent2); }
.tier-3 { background: rgba(34,211,160,0.1); color: var(--success); }
.card-date { font-family: var(--mono); font-size: 9px; color: var(--muted); }
.card-due { font-family: var(--mono); font-size: 9px; }
.due-soon { color: var(--warning); }
.due-overdue { color: var(--accent); }
.due-ok { color: var(--muted); }
.card-actions { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.move-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 7px; font-family: var(--mono); font-size: 9px; color: var(--muted); cursor: pointer; transition: all 0.15s; }
.move-btn:hover { border-color: var(--accent); color: var(--text); }
.del-btn { background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 3px 7px; font-family: var(--mono); font-size: 9px; color: var(--muted); cursor: pointer; transition: all 0.15s; margin-left: auto; }
.del-btn:hover { border-color: var(--accent); color: var(--accent); }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 16px; font-weight: 800; margin-bottom: 20px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.field input, .field select, .field textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 10px 14px; color: var(--text); font-family: var(--mono); font-size: 12px; outline: none; transition: border-color 0.2s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 70px; }
.field select option { background: var(--surface2); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
.empty-state { padding: 20px 10px; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--muted); line-height: 1.8; }
.filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.filter-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-family: var(--mono); font-size: 11px; color: var(--muted); cursor: pointer; transition: all 0.15s; }
.filter-chip.active { border-color: var(--accent); color: var(--text); background: rgba(227,25,55,0.1); }
.search-input { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-family: var(--mono); font-size: 11px; color: var(--text); outline: none; transition: border-color 0.2s; }
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }
.loading-overlay { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 48px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.saving-indicator { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.vertical-badge { font-family: var(--mono); font-size: 9px; padding: 2px 6px; border-radius: 3px; }
@media (max-width: 1100px) { .kanban { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 700px) { .kanban { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>

<script>
const WORKER = 'https://jarvis-api.nathanjnovacek.workers.dev';
const NOTION_DB_ID = '1abb4570-d1bc-41c8-8c3d-31602ff160e8';
const STAGES = ['Identified','Contacted','Meeting','Proposal','Won','Lost'];
const STAGE_COLORS = { Identified:'var(--s-identified)', Contacted:'var(--s-contacted)', Meeting:'var(--s-meeting)', Proposal:'var(--s-proposal)', Won:'var(--s-won)', Lost:'var(--s-lost)' };
const VERTICAL_COLORS = { 'Real Estate':'rgba(255,107,53,0.15)', 'Law':'rgba(139,92,246,0.15)', 'Healthcare':'rgba(74,144,217,0.15)', 'Construction':'rgba(245,200,66,0.15)', 'Government':'rgba(34,211,160,0.15)', 'Other':'rgba(107,107,136,0.15)' };
const VERTICAL_TEXT = { 'Real Estate':'#ff6b35', 'Law':'#a78bfa', 'Healthcare':'#4a90d9', 'Construction':'#f5c842', 'Government':'#22d3a0', 'Other':'#6b6b88' };

let accounts = [];
let editingId = null;
let filters = { tier: 'all', vertical: 'all' };

// ── Notion helpers ────────────────────────────────────────────────────────────

function pageToAccount(page) {
  const p = page.properties;
  const txt = prop => prop?.rich_text?.[0]?.plain_text || '';
  const sel = prop => prop?.select?.name || '';
  const dt  = prop => prop?.date?.start || '';
  const ms  = prop => (prop?.multi_select || []).map(t => t.name);
  const ttl = prop => prop?.title?.[0]?.plain_text || '';
  return {
    id:       page.id,
    name:     ttl(p['Name']),
    company:  txt(p['Company']),
    role:     txt(p['Role']),
    vertical: sel(p['Vertical']),
    tier:     sel(p['Tier']) || 'Tier 3',
    stage:    sel(p['Stage']) || 'Identified',
    followup: dt(p['Follow-up Date']),
    tags:     ms(p['Tags']),
    notes:    txt(p['Angle']),
    nextStep: txt(p['Next Step']),
    added:    dt(p['Date Added']),
    status:   sel(p['Status']),
  };
}

function accountToNotionProps(a) {
  const rt = v => v ? [{ text: { content: v } }] : [];
  const sl = v => v ? { name: v } : null;
  return {
    'Name':          { title: [{ text: { content: a.name || '' } }] },
    'Company':       { rich_text: rt(a.company) },
    'Role':          { rich_text: rt(a.role) },
    'Vertical':      { select: sl(a.vertical) },
    'Tier':          { select: sl(a.tier) },
    'Stage':         { select: sl(a.stage) },
    'Follow-up Date':a.followup ? { date: { start: a.followup } } : { date: null },
    'Tags':          { multi_select: (a.tags||[]).map(t=>({ name: t })) },
    'Angle':         { rich_text: rt(a.notes) },
    'Next Step':     { rich_text: rt(a.nextStep) },
  };
}

// ── API calls ─────────────────────────────────────────────────────────────────

async function loadFromNotion() {
  const res  = await fetch(`${WORKER}/notion/query`, { method: 'POST' });
  const data = await res.json();
  accounts = (data.results || []).map(pageToAccount);
}

async function createInNotion(a) {
  setSaving(true);
  const res = await fetch(`${WORKER}/notion/create`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      parent: { database_id: NOTION_DB_ID },
      properties: {
        ...accountToNotionProps(a),
        'Date Added': { date: { start: today() } },
      },
    }),
  });
  const page = await res.json();
  setSaving(false);
  return page.id;
}

async function updateInNotion(id, a) {
  setSaving(true);
  await fetch(`${WORKER}/notion/update/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ properties: accountToNotionProps(a) }),
  });
  setSaving(false);
}

async function deleteFromNotion(id) {
  setSaving(true);
  await fetch(`${WORKER}/notion/delete/${id}`, { method: 'DELETE' });
  setSaving(false);
}

// ── Utilities ─────────────────────────────────────────────────────────────────

function today() { return new Date().toISOString().split('T')[0]; }

function setSaving(active) {
  document.getElementById('savingIndicator').textContent = active ? '⟳ Syncing...' : '✓ Synced';
  if (!active) setTimeout(() => { document.getElementById('savingIndicator').textContent = ''; }, 2000);
}

function dueSeverity(d) {
  if (!d) return null;
  const diff = (new Date(d) - new Date()) / 86400000;
  if (diff < 0) return 'due-overdue';
  if (diff <= 3) return 'due-soon';
  return 'due-ok';
}

function fmtDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('en-AU', { day:'numeric', month:'short' });
}

function setFilter(el, type, value) {
  document.querySelectorAll(`.filter-chip[data-${type}]`).forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  filters[type] = value;
  render();
}

function filteredAccounts() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  return accounts.filter(a => {
    const matchTier     = filters.tier === 'all' || a.tier === filters.tier;
    const matchVertical = filters.vertical === 'all' || a.vertical === filters.vertical;
    const matchQ        = !q || a.name.toLowerCase().includes(q) || a.company.toLowerCase().includes(q) || (a.tags||[]).join(' ').toLowerCase().includes(q);
    return matchTier && matchVertical && matchQ;
  });
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderStats() {
  const total   = accounts.length;
  const active  = accounts.filter(a => !['Won','Lost'].includes(a.stage)).length;
  const won     = accounts.filter(a => a.stage === 'Won').length;
  const overdue = accounts.filter(a => a.followup && dueSeverity(a.followup) === 'due-overdue').length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total Contacts</div><div class="stat-value" style="color:var(--text)">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Active</div><div class="stat-value" style="color:var(--accent2)">${active}</div></div>
    <div class="stat-card"><div class="stat-label">Won</div><div class="stat-value" style="color:var(--success)">${won}</div></div>
    <div class="stat-card"><div class="stat-label">Overdue Follow-ups</div><div class="stat-value" style="color:${overdue>0?'var(--accent)':'var(--muted)'}">${overdue}</div></div>`;
}

function render() {
  renderStats();
  const fa     = filteredAccounts();
  const wrap   = document.getElementById('kanbanWrap');
  let html     = '<div class="kanban">';
  STAGES.forEach(stage => {
    const cards    = fa.filter(a => a.stage === stage);
    const stageIdx = STAGES.indexOf(stage);
    html += `<div class="column">
      <div class="col-header">
        <div class="col-title"><div class="col-dot" style="background:${STAGE_COLORS[stage]}"></div>${stage}</div>
        <div class="col-count">${cards.length}</div>
      </div>
      <div class="col-body">
        ${cards.length === 0 ? '<div class="empty-state">No contacts</div>' : cards.map(a => cardHTML(a, stageIdx)).join('')}
      </div>
    </div>`;
  });
  html += '</div>';
  wrap.innerHTML = html;
}

function cardHTML(a, stageIdx) {
  const prevStage = stageIdx > 0 ? STAGES[stageIdx-1] : null;
  const nextStage = stageIdx < STAGES.length-1 ? STAGES[stageIdx+1] : null;
  const ds        = dueSeverity(a.followup);
  const dueHTML   = a.followup ? `<span class="card-due ${ds}">↻ ${fmtDate(a.followup)}</span>` : '';
  const tierClass = a.tier === 'Tier 1' ? 'tier-1' : a.tier === 'Tier 2' ? 'tier-2' : 'tier-3';
  const vColor    = VERTICAL_COLORS[a.vertical] || 'rgba(107,107,136,0.15)';
  const vText     = VERTICAL_TEXT[a.vertical] || '#6b6b88';
  const vertBadge = a.vertical ? `<span class="vertical-badge" style="background:${vColor};color:${vText}">${a.vertical}</span>` : '';
  const tags      = (a.tags||[]).slice(0,2).map(t => `<span class="card-tag">${t}</span>`).join('');
  return `<div class="card" onclick="openEditModal('${a.id}')">
    <div class="card-name">${a.name || a.company}</div>
    ${a.name && a.company ? `<div class="card-company">${a.company}</div>` : ''}
    ${a.role ? `<div class="card-meta">${a.role}</div>` : ''}
    ${tags || vertBadge ? `<div class="card-tags">${vertBadge}${tags}</div>` : ''}
    <div class="card-footer">
      <span class="card-tier ${tierClass}">${a.tier}</span>
      ${dueHTML}
    </div>
    <div class="card-actions" onclick="event.stopPropagation()">
      ${prevStage ? `<button class="move-btn" onclick="moveCard('${a.id}','${prevStage}')">← ${prevStage}</button>` : ''}
      ${nextStage ? `<button class="move-btn" onclick="moveCard('${a.id}','${nextStage}')">${nextStage} →</button>` : ''}
      <button class="del-btn" onclick="deleteCard('${a.id}')">✕</button>
    </div>
  </div>`;
}

// ── Actions ───────────────────────────────────────────────────────────────────

async function moveCard(id, stage) {
  const a = accounts.find(x => x.id === id);
  if (!a) return;
  a.stage = stage;
  render();
  await updateInNotion(id, a);
}

async function deleteCard(id) {
  if (!confirm('Remove this contact from the pipeline?')) return;
  accounts = accounts.filter(x => x.id !== id);
  render();
  await deleteFromNotion(id);
}

function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Add Contact';
  ['fName','fCompany','fRole','fFollowup','fTags','fNotes','fNextStep'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fVertical').value = '';
  document.getElementById('fTier').value = 'Tier 2';
  document.getElementById('fStage').value = 'Identified';
  document.getElementById('modalBg').style.display = 'flex';
  document.getElementById('fName').focus();
}

function openEditModal(id) {
  const a = accounts.find(x => x.id === id);
  if (!a) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit Contact';
  document.getElementById('fName').value     = a.name;
  document.getElementById('fCompany').value  = a.company;
  document.getElementById('fRole').value     = a.role;
  document.getElementById('fVertical').value = a.vertical;
  document.getElementById('fTier').value     = a.tier;
  document.getElementById('fStage').value    = a.stage;
  document.getElementById('fFollowup').value = a.followup;
  document.getElementById('fTags').value     = (a.tags||[]).join(', ');
  document.getElementById('fNotes').value    = a.notes;
  document.getElementById('fNextStep').value = a.nextStep;
  document.getElementById('modalBg').style.display = 'flex';
}

function closeModal() { document.getElementById('modalBg').style.display = 'none'; }

async function saveContact() {
  const name    = document.getElementById('fName').value.trim();
  const company = document.getElementById('fCompany').value.trim();
  if (!name && !company) { alert('Contact name or company is required.'); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  const data = {
    name,
    company,
    role:     document.getElementById('fRole').value.trim(),
    vertical: document.getElementById('fVertical').value,
    tier:     document.getElementById('fTier').value,
    stage:    document.getElementById('fStage').value,
    followup: document.getElementById('fFollowup').value,
    tags:     document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean),
    notes:    document.getElementById('fNotes').value.trim(),
    nextStep: document.getElementById('fNextStep').value.trim(),
  };

  if (editingId) {
    const idx = accounts.findIndex(x => x.id === editingId);
    if (idx !== -1) accounts[idx] = { ...accounts[idx], ...data };
    closeModal();
    render();
    await updateInNotion(editingId, data);
  } else {
    closeModal();
    const newId = await createInNotion(data);
    accounts.unshift({ id: newId, added: today(), ...data });
    render();
  }

  btn.disabled = false;
  btn.textContent = 'Save Contact';
}

function exportCSV() {
  const headers = ['Name','Company','Role','Vertical','Tier','Stage','Follow-up','Tags','Notes','Next Step','Added'];
  const rows = accounts.map(a => [
    a.name, a.company, a.role, a.vertical, a.tier, a.stage,
    a.followup, (a.tags||[]).join('; '), (a.notes||'').replace(/\n/g,' '),
    (a.nextStep||'').replace(/\n/g,' '), a.added
  ].map(v => `"${v||''}"`).join(','));
  const csv  = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'jarvis_pipeline.csv'; a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('modalBg').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
  try {
    await loadFromNotion();
    render();
  } catch(e) {
    document.getElementById('kanbanWrap').innerHTML =
      `<div class="loading-overlay" style="color:var(--accent)">⚠ Could not load from Notion. Check Worker and token setup. (${e.message})</div>`;
  }
})();
</script>
